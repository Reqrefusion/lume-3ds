name: Build 3DSX

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release name (empty = latest prerelease)'
        required: false
        type: string
        default: ''


permissions:
  contents: read

concurrency:
  group: build-3dsx-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check Python syntax
        run: python3 -c "import ast,pathlib; [ast.parse(p.read_text(encoding='utf-8-sig')) for folder in ['build','release','scripts'] for p in pathlib.Path(folder).rglob('*.py')]"
      - name: Check complete translations
        run: python3 scripts/check_languages.py
      - name: Build the fixed application only
        run: python3 build/build_player_runtime.py --sdk /opt/devkitpro
      - name: Run lightweight regression checks
        run: python3 -m unittest discover -s release/tests -v
      - name: Prepare release file
        run: python3 release/build_release.py --dest "$RUNNER_TEMP/lume-release"
      - name: Upload application
        uses: actions/upload-artifact@v7
        with:
          name: lume.3dsx
          path: ${{ runner.temp }}/lume-release/lume.3dsx
          archive: false
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-lume-release
      cancel-in-progress: false
    steps:
      - name: Download application
        uses: actions/download-artifact@v8
        with:
          name: lume.3dsx
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          RELEASE_TITLE="$(printf '%s' "${RELEASE_NAME:-}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          RELEASE_TITLE="${RELEASE_TITLE:-latest}"
          RELEASE_TAG="$(printf '%s' "$RELEASE_TITLE" | tr '[:space:]' '-')"
          if [[ "${RELEASE_TAG,,}" == latest ]]; then
            RELEASE_TAG=latest
            RELEASE_TITLE=latest
          fi
          git check-ref-format "refs/tags/$RELEASE_TAG"
          test -s release/lume.3dsx
          NOTES='Download lume.3dsx for the SD card. Download the repository separately and run SETUP.cmd to convert your own original Lume game files.'
          if [[ "$RELEASE_TAG" == latest ]]; then
            if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload latest release/lume.3dsx --repo "$GITHUB_REPOSITORY" --clobber
              gh release edit latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title latest --notes "$NOTES" --prerelease --latest=false
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" -f "sha=$GITHUB_SHA" -F force=true
            else
              gh release create latest release/lume.3dsx --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title latest --notes "$NOTES" --prerelease --latest=false
            fi
          else
            gh release create --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes "$NOTES" --latest -- "$RELEASE_TAG" release/lume.3dsx
          fi
