name: Build 3DSX

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version, e.g. v1.0.0 (leave empty to build only)'
        required: false
        type: string
        default: ''


permissions:
  contents: read

concurrency:
  group: build-3dsx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check Python syntax
        run: python3 -c "import ast,pathlib; [ast.parse(p.read_text(encoding='utf-8-sig')) for folder in ['build','release','scripts'] for p in pathlib.Path(folder).rglob('*.py')]"
      - name: Check complete translations
        run: python3 scripts/check_languages.py
      - name: Build the fixed application only
        run: python3 build/build_player_runtime.py --sdk /opt/devkitpro
      - name: Run lightweight regression checks
        run: python3 -m unittest discover -s release/tests -v
      - name: Prepare release file
        run: python3 release/build_release.py --dest "$RUNNER_TEMP/lume-release"
      - name: Upload application
        uses: actions/upload-artifact@v7
        with:
          name: lume.3dsx
          path: ${{ runner.temp }}/lume-release/lume.3dsx
          archive: false
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download application
        uses: actions/download-artifact@v8
        with:
          name: lume.3dsx
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *) echo 'Use a version tag such as v1.0.0.' >&2; exit 1 ;;
          esac
          git check-ref-format "refs/tags/$RELEASE_TAG"
          test -s release/lume.3dsx
          gh release create "$RELEASE_TAG" release/lume.3dsx \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes 'Download lume.3dsx for the SD card. Download the repository separately and run SETUP.cmd to convert your own original Lume game files.'
